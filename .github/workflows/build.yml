name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # llama.cpp build bundled as the built-in model engine (llama-server)
  LLAMA_TAG: b11669
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - name: Engine simulation
        working-directory: tests/Qalam.Sim
        run: dotnet run -c Release
      - name: Built-in model engine (llama-server + tiny model)
        run: |
          curl -sSL -o /tmp/llama.tar.gz "$LLAMA_URL/$LLAMA_TAG/llama-$LLAMA_TAG-bin-ubuntu-x64.tar.gz"
          mkdir -p /tmp/llama && tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          SERVER=$(find /tmp/llama -name llama-server -type f | head -1)
          pip install -q gguf numpy
          python3 tests/Qalam.EngineTest/make_tiny.py /tmp/tiny.gguf
          cd tests/Qalam.EngineTest && QALAM_LLAMA_SERVER="$SERVER" dotnet run -c Release -- /tmp/tiny.gguf

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - name: Version
        shell: bash
        run: |
          V="0.1.${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          echo "QALAM_VERSION=$V" >> $GITHUB_ENV
      - name: Publish
        run: dotnet publish src/Qalam.App/Qalam.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.QALAM_VERSION }} -o out/win-x64
      - name: Bundle model engine (llama.cpp)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\llama.zip"
          Invoke-WebRequest "$env:LLAMA_URL/$env:LLAMA_TAG/llama-$env:LLAMA_TAG-bin-win-cpu-x64.zip" -OutFile $zip
          $tmp = "$env:RUNNER_TEMP\llama"
          Expand-Archive $zip -DestinationPath $tmp -Force
          $server = Get-ChildItem $tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe not found in the llama.cpp archive" }
          $dest = "out/win-x64/llama"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $server.FullName $dest
          Get-ChildItem $server.DirectoryName -Filter *.dll | Copy-Item -Destination $dest
          Get-ChildItem $server.DirectoryName -Filter LICENSE* | Copy-Item -Destination $dest
          & "$dest/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server does not start" }
          Get-ChildItem $dest | Measure-Object -Property Length -Sum | ForEach-Object { "engine size: {0:N1} MB" -f ($_.Sum / 1MB) }
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc packaging/windows/qalam.iss
          Compress-Archive -Path out/win-x64/* -DestinationPath "out/Qalam-${env:QALAM_VERSION}-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: qalam-windows
          path: |
            out/Qalam-Setup-*.exe
            out/*-windows-portable.zip

  macos:
    runs-on: macos-latest
    needs: test
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - name: Version
        run: |
          V="0.1.${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          echo "QALAM_VERSION=$V" >> $GITHUB_ENV
      - name: Publish
        run: dotnet publish src/Qalam.App/Qalam.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$QALAM_VERSION -o out/${{ matrix.rid }}
      - name: Bundle model engine (llama.cpp)
        run: |
          LARCH=$([ "${{ matrix.rid }}" = "osx-arm64" ] && echo "arm64" || echo "x64")
          curl -sSL -o /tmp/llama.tar.gz "$LLAMA_URL/$LLAMA_TAG/llama-$LLAMA_TAG-bin-macos-$LARCH.tar.gz"
          mkdir -p /tmp/llama && tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          SERVER=$(find /tmp/llama -name llama-server -type f | head -1)
          [ -n "$SERVER" ] || { echo "llama-server not found in archive"; exit 1; }
          SRC=$(dirname "$SERVER")
          DEST=out/${{ matrix.rid }}/llama
          mkdir -p "$DEST"
          cp -a "$SERVER" "$DEST/"
          cp -a "$SRC"/*.dylib "$DEST/" 2>/dev/null || true
          cp -a "$SRC"/LICENSE* "$DEST/" 2>/dev/null || true
          chmod +x "$DEST/llama-server"
          if [ "$LARCH" = "arm64" ]; then "$DEST/llama-server" --version; fi
          du -sh "$DEST"
      - name: App bundle + DMG
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          ARCH=$([ "${{ matrix.rid }}" = "osx-arm64" ] && echo "AppleSilicon" || echo "Intel")
          APP=out/Qalam.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp -R out/${{ matrix.rid }}/* $APP/Contents/MacOS/
          sed "s/__VERSION__/$QALAM_VERSION/g" packaging/macos/Info.plist > $APP/Contents/Info.plist
          cp packaging/macos/qalam.icns $APP/Contents/Resources/
          chmod +x $APP/Contents/MacOS/Qalam
          # Persistent self-signed identity (repo secrets) → macOS keeps Accessibility / Input Monitoring
          # permissions across updates. Without the secrets: ad-hoc signature as before.
          SIGN="-"
          if [ -n "$MACOS_CERT_P12" ]; then
            KC="$RUNNER_TEMP/qalam.keychain-db"; KCPW=$(openssl rand -hex 12)
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/qalam.p12"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            security import "$RUNNER_TEMP/qalam.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-certificate -c "Qalam Code Signing" -p "$KC" > "$RUNNER_TEMP/qalam-cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/qalam-cert.pem" || echo "trust not added (ok)"
            SIGN=$(security find-identity -p codesigning "$KC" | awk '/Qalam Code Signing/ {print $2; exit}')
            echo "signing identity: $SIGN"
          fi
          find "$APP/Contents/MacOS/llama" -type f \( -name "*.dylib" -o -name "llama-server" \) -print0 | xargs -0 -n1 codesign --force --timestamp=none --sign "$SIGN"
          codesign --force --deep --timestamp=none --sign "$SIGN" $APP
          codesign --verify --deep --strict $APP && echo "signature OK" || echo "::warning::codesign verify reported a problem"
          DR=$(codesign -d -r- $APP 2>&1 | grep designated | head -1)
          echo "::notice::${{ matrix.rid }} signed with ${SIGN:0:12}… — $DR"
          mkdir -p out/dmg && cp -R $APP out/dmg/ && ln -s /Applications out/dmg/Applications
          hdiutil create -volname Qalam -srcfolder out/dmg -ov -format UDZO "out/Qalam-$QALAM_VERSION-macOS-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: qalam-${{ matrix.rid }}
          path: out/*.dmg

  release:
    # publish a GitHub Release when a tag v* is pushed or the commit message contains [release]
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    needs: [ windows, macos ]
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Version
        run: |
          V="0.1.${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          echo "QALAM_VERSION=$V" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.QALAM_VERSION }}
          name: Qalam ${{ env.QALAM_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** `Qalam-Setup-….exe` — установщик (без прав администратора) или portable .zip.
            **macOS:** `…-macOS-AppleSilicon.dmg` для M1–M4, `…-Intel.dmg` для Intel. Первый запуск: правый клик → «Открыть», затем разрешить «Универсальный доступ» и «Мониторинг ввода».
          files: dist/*
